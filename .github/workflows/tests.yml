name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
          
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
          
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Check syntax
        run: |
          python -m py_compile main.py
          python -m py_compile movement/*.py
          python -m py_compile brain/*.py
          python -m py_compile sal/*.py
          python -m py_compile api/*.py
          
      - name: Run infrastructure tests
        run: |
          python -m pytest tests/test_config.py tests/test_infrastructure.py -v
