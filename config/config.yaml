hardware:
  pca9685_address: 64
  mpu6050_address: 104
  ads7830_address: 72
  i2c_bus: 1
  led_pin: 18
  led_count: 8
  buzzer_pin: 17
  ultrasonic_trigger: 27
  ultrasonic_echo: 22
servos:
  camera:
    tilt:
      channel: 14
      inverted: false
      limit_neg: 45
      limit_pos: 45
      middle: 90
  leg_fl:
    joint_1:
      channel: 0
      inverted: false
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_2:
      channel: 1
      inverted: false
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_3:
      channel: 2
      inverted: false
      limit_neg: 90
      limit_pos: 90
      middle: 90
  leg_fr:
    joint_1:
      channel: 3
      inverted: true
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_2:
      channel: 4
      inverted: true
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_3:
      channel: 5
      inverted: true
      limit_neg: 90
      limit_pos: 90
      middle: 90
  leg_rl:
    joint_1:
      channel: 6
      inverted: false
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_2:
      channel: 7
      inverted: false
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_3:
      channel: 8
      inverted: false
      limit_neg: 90
      limit_pos: 90
      middle: 90
  leg_rr:
    joint_1:
      channel: 9
      inverted: true
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_2:
      channel: 10
      inverted: true
      limit_neg: 90
      limit_pos: 90
      middle: 90
    joint_3:
      channel: 11
      inverted: true
      limit_neg: 90
      limit_pos: 90
      middle: 90
system:
  control_loop_hz: 50
  log_level: INFO
  simulation_mode: true
  camera_stabilization: true
  camera_stabilization_crop: 0.15
  vision_processing_skip: 10
  vision_fps_limit: 20
  gesture_trust_threshold: 0.1
  web_host: 0.0.0.0
  web_port: 5000
  show_vision_debug: true
  social_memory_min_exposure: 60
  social_memory_max_age_hours: 2
  base_height: 105
  shoulder_to_body_offset: 50
  body_length: 140
  body_width: 80
  # Vision Watchdog Settings
  vision_watchdog_timeout: 30.0      # seconds before restart attempt
  vision_max_restarts: 5              # maximum restart attempts before giving up
  vision_boot_timeout: 60.0          # grace period during startup (camera init)
  # Queue Consumer Settings
  queue_consumer_timeout: 0.01       # seconds to wait for queue item
  max_queue_items_per_update: 3      # max items to process per update cycle
  # Face Recognition Settings
  face_match_threshold: 1.0          # L2 distance for face match
  face_new_angle_threshold: 0.5       # Distance for new template (viewpoint)
  face_embedding_alpha: 0.01          # Update rate for embedding adaptation
  face_max_templates: 10              # Maximum templates per face
mapping:
  markers:
    '0':
      size: 100.0
      name: Ladestation (Base)
mqtt:
  broker: localhost
  port: 1883
  username: ''
  password: ''
  base_topic: freenove_dog
  node_id: robot_dog
